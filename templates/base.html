<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}
        Employee Management System
        {% endblock %}
    </title>
    {% block extra_css %}
    {% endblock %}
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/base.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
     <header class="header">

        <div class="logo">
            Employee Management System
        </div>

        <div class="user-info">
            <label >Martin</label>
            <p>Software Developer</p>
        </div>

    </header>
    <aside class="sidebar">

        <nav>


            <a href="{{url_for('employee_view')}}" class="{% if active_page == 'employee_view' %}active{% endif %}">
                
                View & Update
            </a>

            <a href="{{ url_for('employee_add') }}" class="{% if active_page == 'employee_add' %}active{% endif %}">
                Add Employee
            </a>

           


            <a href="{{url_for('logout')}}" class="{% if active_page == 'logout' %}active{% endif %}">
                Logout
            </a>

        </nav>

    </aside>
    <main class="main-content">

        {% block content %}

        {% endblock %}

    </main>
    
</body>
</html>
